openapi: 3.0.3
info:
  title: Todo API
  description: |
    A REST API for managing tasks in a todo application.

    ## Error Handling
    All API errors follow a consistent format:
    ```json
    {
      "success": false,
      "error": {
        "status": "fail", // or "error"
        "statusCode": 400, // HTTP status code
        "message": "Human-readable error message",
        "stack": "Error stack trace (development only)"
      }
    }
    ```

    - `fail` status: Client errors (4xx) - invalid input, not found, etc.
    - `error` status: Server errors (5xx) - database errors, internal issues, etc.
  version: 1.0.0
  contact:
    name: Todo API Support
servers:
  - url: http://localhost:3001/api
    description: Development server
  - url: https://api.todoapp.com/api
    description: Production server

paths:
  /health:
    get:
      summary: Health check
      description: Returns the health status of the server
      tags:
        - Health
      responses:
        '200':
          description: Server is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error:
                  status: "error"
                  statusCode: 500
                  message: "Internal server error"

  /tasks:
    get:
      summary: Get all tasks
      description: Retrieve a paginated list of tasks with optional filtering by status and sorting by creation date or deadline
      tags:
        - Tasks
      parameters:
        - name: page
          in: query
          description: "Page number for pagination (default: 1)"
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          description: "Number of tasks per page (default: 10)"
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
        - name: status
          in: query
          description: Filter tasks by status
          required: false
          schema:
            $ref: '#/components/schemas/TaskStatus'
        - name: sort
          in: query
          description: Sort tasks by field
          required: false
          schema:
            type: string
            enum: [createdAt, deadline]
            default: createdAt
          example: createdAt
      responses:
        '200':
          description: Successfully retrieved tasks
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TasksResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error:
                  status: "error"
                  statusCode: 500
                  message: "Database error occurred while fetching tasks"

    post:
      summary: Create a new task
      description: Create a new task with the provided title, description, status, and optional deadline
      tags:
        - Tasks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskRequest'
      responses:
        '201':
          description: Task created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          description: Bad request - invalid input data (e.g., invalid deadline format)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error:
                  status: "fail"
                  statusCode: 400
                  message: "Invalid deadline format. Must be a valid ISO date string."
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error:
                  status: "error"
                  statusCode: 500
                  message: "Database error occurred"

  /tasks/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: The task ID
        schema:
          type: integer
          minimum: 1

    get:
      summary: Get a task by ID
      description: Retrieve a single task by its ID
      tags:
        - Tasks
      responses:
        '200':
          description: Task retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '404':
          description: Task not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error:
                  status: "fail"
                  statusCode: 404
                  message: "Task not found"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error:
                  status: "error"
                  statusCode: 500
                  message: "Database error occurred while fetching task"

    put:
      summary: Update a task
      description: Update an existing task with the provided fields including optional deadline
      tags:
        - Tasks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTaskRequest'
      responses:
        '200':
          description: Task updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          description: Bad request - invalid input data (e.g., invalid deadline format)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error:
                  status: "fail"
                  statusCode: 400
                  message: "Invalid deadline format. Must be a valid ISO date string."
        '404':
          description: Task not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error:
                  status: "fail"
                  statusCode: 404
                  message: "Task not found"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error:
                  status: "error"
                  statusCode: 500
                  message: "Database error occurred while updating task"

    delete:
      summary: Soft delete a task
      description: Mark a task as deleted (soft delete). The task can be restored within 5 minutes using the restore endpoint.
      tags:
        - Tasks
      responses:
        '200':
          description: Task marked for deletion successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Task marked for deletion successfully"
        '404':
          description: Task not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error:
                  status: "fail"
                  statusCode: 404
                  message: "Task not found"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error:
                  status: "error"
                  statusCode: 500
                  message: "Database error occurred while deleting task"

    patch:
      summary: Restore a soft-deleted task
      description: Restore a task that was previously soft-deleted. Only works within the undo window.
      tags:
        - Tasks
      responses:
        '200':
          description: Task restored successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '404':
          description: Task not found or not eligible for restoration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error:
                  status: "fail"
                  statusCode: 404
                  message: "Task not found"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error:
                  status: "error"
                  statusCode: 500
                  message: "Database error occurred while restoring task"

  /tasks/{id}/permanent:
    parameters:
      - name: id
        in: path
        required: true
        description: The task ID
        schema:
          type: integer
          minimum: 1

    delete:
      summary: Permanently delete a task
      description: Permanently delete a task from the database. This action cannot be undone.
      tags:
        - Tasks
      responses:
        '200':
          description: Task permanently deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Task permanently deleted successfully"
        '404':
          description: Task not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error:
                  status: "fail"
                  statusCode: 404
                  message: "Task not found"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error:
                  status: "error"
                  statusCode: 500
                  message: "Database error occurred while permanently deleting task"

  /tasks/cleanup:
    delete:
      summary: Cleanup old soft-deleted tasks
      description: Permanently delete tasks that have been soft-deleted for longer than the specified time period.
      tags:
        - Tasks
      parameters:
        - name: olderThanMinutes
          in: query
          description: "Minimum age in minutes for soft-deleted tasks to be permanently removed (default: 5)"
          required: false
          schema:
            type: integer
            minimum: 1
            default: 5
            example: 5
      responses:
        '200':
          description: Cleanup completed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "2 old deleted tasks permanently removed"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error:
                  status: "error"
                  statusCode: 500
                  message: "Database error occurred while fetching deleted tasks"

components:
  schemas:
    TaskStatus:
      type: string
      enum: [TODO, IN_PROGRESS, DONE]
      description: The status of a task
      example: "TODO"

    Task:
      type: object
      required:
        - id
        - title
        - status
        - created_at
        - updated_at
      properties:
        id:
          type: integer
          description: Unique identifier for the task
          example: 1
        title:
          type: string
          description: The title of the task
          example: "Complete project documentation"
        description:
          type: string
          description: Detailed description of the task
          example: "Write comprehensive API documentation for the todo application"
        status:
          $ref: '#/components/schemas/TaskStatus'
        deadline:
          type: string
          format: date-time
          nullable: true
          description: Optional deadline for the task
          example: "2025-12-31T23:59:59.000Z"
        deleted_at:
          type: string
          format: date-time
          nullable: true
          description: Timestamp when the task was soft-deleted (null if not deleted)
          example: null
        created_at:
          type: string
          format: date-time
          description: Timestamp when the task was created
          example: "2023-12-01T10:00:00.000Z"
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the task was last updated
          example: "2023-12-01T15:30:00.000Z"

    CreateTaskRequest:
      type: object
      required:
        - title
      properties:
        title:
          type: string
          description: The title of the task
          example: "Complete project documentation"
        description:
          type: string
          description: Detailed description of the task
          example: "Write comprehensive API documentation for the todo application"
        status:
          $ref: '#/components/schemas/TaskStatus'
        deadline:
          type: string
          format: date-time
          nullable: true
          description: Optional deadline for the task (ISO date-time string)
          example: "2025-12-31T23:59:59.000Z"

    UpdateTaskRequest:
      type: object
      properties:
        title:
          type: string
          description: The title of the task
          example: "Complete project documentation"
        description:
          type: string
          description: Detailed description of the task
          example: "Write comprehensive API documentation for the todo application"
        status:
          $ref: '#/components/schemas/TaskStatus'
        deadline:
          type: string
          format: date-time
          nullable: true
          description: Optional deadline for the task (ISO date-time string)
          example: "2025-12-31T23:59:59.000Z"

    TasksResponse:
      type: object
      properties:
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/Task'
        pagination:
          type: object
          properties:
            currentPage:
              type: integer
              example: 1
            totalPages:
              type: integer
              example: 5
            totalTasks:
              type: integer
              example: 47
            limit:
              type: integer
              example: 10

    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: "success"
        message:
          type: string
          example: "Server is healthy"

    ErrorResponse:
      type: object
      required:
        - success
        - error
      properties:
        success:
          type: boolean
          description: Always false for error responses
          example: false
        error:
          $ref: '#/components/schemas/ApiError'
      description: Standard API error response format

    ApiError:
      type: object
      required:
        - status
        - statusCode
        - message
      properties:
        status:
          type: string
          enum: ["fail", "error"]
          description: Error status type (fail for client errors, error for server errors)
          example: "fail"
        statusCode:
          type: integer
          description: HTTP status code
          example: 400
        message:
          type: string
          description: Human-readable error message
          example: "Invalid deadline format. Must be a valid ISO date string."
        stack:
          type: string
          description: Error stack trace (only included in development mode)
          example: "Error: Invalid deadline format...\n    at TaskController.createTask (taskController.js:10:5)"

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

tags:
  - name: Tasks
    description: Task management operations
  - name: Health
    description: Health check operations
