openapi: 3.0.3
info:
  title: TODO API
  version: 1.0.0
  description: >
    Express + Postgres API for managing TODO tasks. All endpoints are prefixed
    with `/api`. Tasks are soft-deleted; list/count endpoints exclude items
    with `deleted_at` set, and deletes can be undone for 5 seconds.
servers:
  - url: http://localhost:3001
    description: Local development
paths:
  /api/health:
    get:
      summary: Health check
      tags: [health]
      responses:
        '200':
          description: Service is healthy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: ok
  /api/tasks:
    get:
      summary: List tasks
      tags: [tasks]
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
          description: 1-based page index (5 tasks per page).
        - in: query
          name: status
          schema:
            $ref: '#/components/schemas/TaskStatus'
          description: Optional filter by task status.
        - in: query
          name: sort
          schema:
            type: string
            enum: [createdAt, deadline]
            default: createdAt
          description: >
            Optional sort order. `createdAt` shows newest tasks first. `deadline` shows tasks with a deadline first
            (nearest deadline first) and tasks without deadlines last.
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 5
          description: Optional page size (defaults to 5, capped at 50).
      responses:
        '200':
          description: Paginated list of tasks.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTasks'
        '400':
          description: Invalid query parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  message: Invalid status value
                  statusCode: 400
    post:
      summary: Create a task
      tags: [tasks]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskInput'
            examples:
              minimal:
                summary: Minimal payload
                value:
                  title: Buy milk
              full:
                summary: With description and status
                value:
                  title: Buy milk
                  description: 2% or oat milk
                  status: TODO
                  deadline: 2025-02-01T15:00:00Z
      responses:
        '201':
          description: Task created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          description: Validation failed (missing title, invalid status, or invalid deadline).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  message: Title is required
                  statusCode: 400
  /api/tasks/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          minimum: 1
        description: Task identifier.
    get:
      summary: Get a task
      tags: [tasks]
      responses:
        '200':
          description: Task found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '404':
          description: Task not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  message: Task not found
                  statusCode: 404
    put:
      summary: Update a task
      tags: [tasks]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTaskInput'
            example:
              title: Buy groceries
              description: Include fruit
              status: IN_PROGRESS
              deadline: 2025-02-10T10:00:00Z
      responses:
        '200':
          description: Task updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          description: Validation failed (empty title, invalid status, or invalid deadline).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  message: Invalid status value
                  statusCode: 400
        '404':
          description: Task not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  message: Task not found
                  statusCode: 404
    delete:
      summary: Soft-delete a task
      tags: [tasks]
      responses:
        '204':
          description: Task soft-deleted (row retained with `deleted_at` set).
        '404':
          description: Task not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  message: Task not found
                  statusCode: 404
    post:
      operationId: undoDeleteTask
      summary: Undo a recent delete
      tags: [tasks]
      description: >
        Clears `deleted_at` if the task was soft-deleted within the last 5 seconds. If the window expired or the task
        is not deleted, returns 409.
      responses:
        '200':
          description: Task restored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '404':
          description: Task not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  message: Task not found
                  statusCode: 404
        '409':
          description: Undo window expired or task is not deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                notDeleted:
                  summary: Not deleted
                  value:
                    error:
                      message: Task is not deleted
                      statusCode: 409
                expired:
                  summary: Undo window expired
                  value:
                    error:
                      message: Undo window expired
                      statusCode: 409
components:
  schemas:
    TaskStatus:
          type: string
          description: Task status enum as stored in Postgres.
          enum: [TODO, IN_PROGRESS, DONE]
    Task:
      type: object
      properties:
        id:
          type: integer
          format: int32
        title:
          type: string
        description:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/TaskStatus'
        deadline:
          type: string
          format: date-time
          nullable: true
          description: Optional task deadline in ISO 8601 format.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required: [id, title, status, created_at, updated_at]
    PaginatedTasks:
      type: object
      properties:
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/Task'
        page:
          type: integer
          minimum: 1
        totalPages:
          type: integer
          minimum: 1
        totalCount:
          type: integer
          minimum: 0
      required: [tasks, page, totalPages, totalCount]
    CreateTaskInput:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/TaskStatus'
        deadline:
          type: string
          format: date-time
          nullable: true
          description: Optional deadline in ISO 8601 format (e.g. 2025-02-01T15:00:00Z).
      required: [title]
    UpdateTaskInput:
      type: object
      properties:
        title:
          type: string
          description: If provided, cannot be an empty string.
        description:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/TaskStatus'
        deadline:
          type: string
          format: date-time
          nullable: true
          description: Optional deadline in ISO 8601 format. Provide null to clear the deadline.
      description: Provide any combination of fields to update.
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            message:
              type: string
            statusCode:
              type: integer
            details:
              nullable: true
          required: [message, statusCode]
      required: [error]
    HealthResponse:
      type: object
      properties:
        status:
          type: string
      required: [status]
