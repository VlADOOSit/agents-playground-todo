version: "3.9"

services:
  postgres:
    image: postgres:13-alpine
    environment:
      POSTGRES_DB: todo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d todo"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  server:
    build: ./server
    environment:
      PORT: 3001
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/todo
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3001:3001"
    command: sh -c "npm run db:migrate && npm run start"

  client:
    build: ./client
    environment:
      VITE_API_URL: http://server:3001/api
    depends_on:
      - server
    ports:
      - "5173:5173"

volumes:
  postgres_data:
